[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "essential"
version = "0.0.1"
dependencies = [
    "anndata==0.12.10",
    "black==26.3.1",
    "cobra==0.31.1",
    "igraph==1.0.0",
    "jupyterlab==4.5.6",
    "leidenalg==0.11.0",
    "matplotlib==3.10.8",
    "networkx==3.6.1",
    "optuna==4.8.0",
    "plotly==6.6.0",
    "plotnine==0.15.3",
    "pytest==9.0.2",
    "scanpy==1.11.5",
    "scikit-image==0.25.2",
    "scikit-misc==0.5.2",
    "scipy==1.17.1",
    "scvi-tools==1.4.2",
    "seaborn==0.13.2",
    "requests>=2.32",
    "google-genai",
    "ollama",
    "pre-commit==4.5.1",
    "nbstripout==0.9.1",
    "snakemake",
    "jax[cuda12]==0.9.2; sys_platform == 'linux'",
    "jax==0.9.2; sys_platform == 'darwin'",
    "torch==2.11.0+cu128; sys_platform == 'linux'",
    "torchvision==0.26.0+cu128; sys_platform == 'linux'",
    "torch==2.11.0; sys_platform == 'darwin'",
    "torchvision==0.26.0; sys_platform == 'darwin'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

